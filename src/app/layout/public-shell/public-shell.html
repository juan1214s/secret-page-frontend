<div class="flex min-h-screen flex-col bg-black text-red-500">
  <header class="border-b border-red-900/30 bg-black">
    <div class="mx-auto flex max-w-6xl items-center justify-center px-6 py-4">
      <a routerLink="/" class="text-4xl font-bold tracking-wide">
        <span class="text-red-700">EL SECRETO</span>
      </a>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-red-900/30 bg-black">
    <div class="mx-auto flex max-w-6xl flex-col gap-8 px-6 py-10 md:flex-row md:items-start md:justify-between">
      <div class="flex flex-col gap-3">
        <span class="text-sm text-red-500/60">{{ footer.copyright }}</span>
        <div class="flex flex-wrap items-center gap-3 text-xs text-red-500/50">
          <span>{{ footer.acceptedPaymentsLabel }}</span>
          <span class="inline-flex gap-2">
            <svg viewBox="0 0 24 16" class="h-5 w-8">
              <rect x="0.5" y="0.5" width="23" height="15" rx="2" fill="#1434CB" stroke="#0d2489" stroke-width="0.5" />
              <rect x="0.5" y="6" width="23" height="2.5" fill="#f7b600" />
              <rect x="3" y="10.5" width="7" height="2" rx="0.5" fill="#ffffff" />
            </svg>
            <svg viewBox="0 0 24 16" class="h-5 w-8">
              <rect x="0.5" y="0.5" width="23" height="15" rx="2" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="0.5" />
              <circle cx="10" cy="8" r="4.6" fill="#eb001b" />
              <circle cx="14" cy="8" r="4.6" fill="#f79e1b" fill-opacity="0.9" />
            </svg>
            <svg viewBox="0 0 24 16" class="h-5 w-8">
              <rect x="0.5" y="0.5" width="23" height="15" rx="2" fill="#2e77bb" stroke="#1e5a94" stroke-width="0.5" />
              <rect x="0.5" y="3.5" width="23" height="2" fill="#ffffff" fill-opacity="0.85" />
              <rect x="3" y="9.5" width="9" height="2" rx="0.5" fill="#ffffff" fill-opacity="0.9" />
            </svg>
          </span>
        </div>
      </div>

      <nav class="flex flex-col gap-2 text-sm">
        @for (link of footer.links; track link.label) {
        @if (link.route) {
        <a [routerLink]="link.route" class="text-red-500/70 hover:text-red-400">{{ link.label }}</a>
        } @else {
        <a routerLink="/" [fragment]="link.fragment" class="text-red-500/70 hover:text-red-400">{{ link.label }}</a>
        }
        }
      </nav>
    </div>
  </footer>
</div>
