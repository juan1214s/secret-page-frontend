<div class="min-h-screen flex items-center justify-center bg-bg px-4">
  <div class="w-full max-w-[360px]">
    <div class="flex items-center gap-[9px] justify-center mb-6">
      <span class="w-[9px] h-[9px] rounded-full bg-ok shadow-[0_0_0_3px_var(--color-ok-tint)]"></span>
      <span class="font-bold text-[15px] tracking-[-0.01em]">Sala de Control</span>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="bg-surface border border-line rounded-xl p-7 flex flex-col gap-4 shadow-[0_1px_2px_rgba(18,24,32,0.04)]"
    >
      <div>
        <h1 class="text-[17px] font-bold m-0">Iniciar sesión</h1>
        <p class="text-[13px] text-ink-muted mt-1 mb-0">Acceso solo para administradores del panel.</p>
      </div>

      @if (errorMessage(); as msg) {
        <div class="rounded-lg bg-danger-tint text-danger text-[13px] px-3 py-2.5" role="alert">{{ msg }}</div>
      }

      <label class="flex flex-col gap-1.5">
        <span class="text-[12.5px] font-semibold text-ink-muted">Correo</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          class="rounded-lg border border-line bg-surface-sunken px-3 py-2.5 text-[14px] text-ink outline-none focus:border-accent focus:bg-surface"
          placeholder="admin@ejemplo.com"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="text-[12px] text-danger">Ingresa un correo válido.</span>
        }
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-[12.5px] font-semibold text-ink-muted">Contraseña</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="rounded-lg border border-line bg-surface-sunken px-3 py-2.5 text-[14px] text-ink outline-none focus:border-accent focus:bg-surface"
          placeholder="••••••••"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="text-[12px] text-danger">La contraseña es obligatoria.</span>
        }
      </label>

      <button
        type="submit"
        [disabled]="submitting()"
        class="mt-1 rounded-lg bg-accent text-white font-semibold text-[14px] py-2.5 disabled:opacity-60"
      >
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
