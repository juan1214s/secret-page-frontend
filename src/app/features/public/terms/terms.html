<div class="mx-auto max-w-3xl px-6 py-16">
  <h1 class="mb-2 text-2xl font-bold text-red-500">{{ content.title }}</h1>
  <p class="mb-10 text-xs text-red-500/50">Última actualización: {{ content.updatedAt }}</p>

  <div class="flex flex-col gap-8">
    @for (section of content.sections; track $index) {
      <section>
        <h2 class="mb-2 text-lg font-semibold text-red-400">{{ section.heading }}</h2>
        <p class="text-sm leading-relaxed text-red-500/70">{{ section.body }}</p>
      </section>
    }
  </div>
</div>
