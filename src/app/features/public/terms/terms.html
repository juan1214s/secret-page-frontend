<div class="mx-auto max-w-3xl px-6 py-16">
  <div class="flex flex-col gap-2">
    @for (section of content.sections; track $index) {
      <section>
        <h2 class="mb-2 mt-3 text-lg font-semibold text-red-500">{{ section.heading }}</h2>
        <p class="text-sm leading-relaxed text-red-500/70">{{ section.body }}</p>
      </section>
    }
  </div>
</div>
