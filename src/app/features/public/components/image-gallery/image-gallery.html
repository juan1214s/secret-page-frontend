<div class="flex flex-col gap-3">
  <div class="relative aspect-square w-full overflow-hidden rounded-lg border border-red-900/20 bg-zinc-900 sm:aspect-[4/3]">
    @if (activeImage(); as img) {
      <img [src]="img.url" alt="" class="h-full w-full object-cover" />
    } @else {
      <div class="flex h-full items-center justify-center text-sm text-red-900/50">Sin imágenes</div>
    }

    @if (sortedImages().length > 1) {
      <button
        type="button"
        (click)="prev()"
        class="absolute left-2 top-1/2 -translate-y-1/2 rounded-full bg-black/60 p-2 text-red-400 hover:text-red-300"
        aria-label="Imagen anterior"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <button
        type="button"
        (click)="next()"
        class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-black/60 p-2 text-red-400 hover:text-red-300"
        aria-label="Imagen siguiente"
      >
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
    }
  </div>

  @if (sortedImages().length > 1) {
    <div class="flex gap-2 overflow-x-auto pb-1">
      @for (img of sortedImages(); track img.id; let i = $index) {
        <button
          type="button"
          (click)="select(i)"
          [class]="
            i === activeIndex()
              ? 'h-16 w-16 flex-none overflow-hidden rounded border-2 border-red-500'
              : 'h-16 w-16 flex-none overflow-hidden rounded border border-red-900/30 opacity-70'
          "
        >
          <img [src]="img.url" alt="" class="h-full w-full object-cover" />
        </button>
      }
    </div>
  }
</div>
