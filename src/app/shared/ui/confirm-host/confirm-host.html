@if (confirm.request(); as req) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-[rgba(18,24,32,0.4)] px-4" (click)="confirm.resolve(false)">
    <div
      class="w-full max-w-[400px] rounded-xl bg-surface border border-line p-6 shadow-[0_12px_32px_rgba(18,24,32,0.18)]"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-[16px] font-bold m-0 mb-2">{{ req.title }}</h2>
      <p class="text-[14px] text-ink-muted leading-relaxed m-0 mb-6">{{ req.message }}</p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          class="px-4 py-2 rounded-lg text-[13.5px] font-semibold border border-line bg-surface hover:bg-surface-sunken"
          (click)="confirm.resolve(false)"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="px-4 py-2 rounded-lg text-[13.5px] font-semibold text-white"
          [class]="req.danger ? 'bg-danger hover:opacity-90' : 'bg-accent hover:opacity-90'"
          (click)="confirm.resolve(true)"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
